name: Build Docker Image


on:

  repository_dispatch:
    types:
      - build_from_upstream

  workflow_dispatch:



permissions:

  contents: read
  packages: write



jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      # ① 拉取 ci 分支
      - name: Checkout ci branch
        uses: actions/checkout@v4
        with:

          ref: ci

          fetch-depth: 0



      # ② 读取 VERSION
      - name: Read VERSION
        id: ver
        shell: bash
        run: |


          VERSION=$(awk -F"'" \
          '/^[[:space:]]*VERSION:[[:space:]]*'\''[^'\'']+'\''/ {print $2; exit}' \
          danmu_api/configs/globals.js)



          if [ -z "$VERSION" ]; then

            echo "ERROR: VERSION parse failed"

            exit 1

          fi



          echo "version=$VERSION" >> $GITHUB_OUTPUT


          echo "Build VERSION=$VERSION"





      # ③ QEMU
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3





      # ④ Buildx
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3





      # ⑤ 登录 GHCR
      - name: Login GHCR
        uses: docker/login-action@v3
        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GHCR_TOKEN }}






      # ⑥ 检查镜像是否存在
      # 自动触发才检查
      - name: Check image exists
        id: check
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |


          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}"



          echo "Checking $IMAGE"



          if docker manifest inspect "$IMAGE" >/dev/null 2>&1

          then

            echo "exists=true" >> $GITHUB_OUTPUT

            echo "Image exists, skip build"



          else

            echo "exists=false" >> $GITHUB_OUTPUT

            echo "Image missing, build required"



          fi






      # ⑦ 构建并推送
      - name: Build and Push Docker Image
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.check.outputs.exists == 'false'

        shell: bash
        run: |


          VERSION="${{ steps.ver.outputs.version }}"



          IMAGE="ghcr.io/${{ github.repository }}"



          echo "Building:"
          echo "$IMAGE:$VERSION"



          docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t $IMAGE:$VERSION \
          -t $IMAGE:latest \
          --push .






      # ⑧ 完成
      - name: Build Finished
        run: |

          echo "Docker build completed"